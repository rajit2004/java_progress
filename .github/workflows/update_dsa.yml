# .github/workflows/update_dsa.yml
name: Update DSA Progress Table

on:
  push:
    branches: [main]
    paths:
      - "JAVA/LeetCode/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dsa-progress
  cancel-in-progress: false

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      # ── 1. Checkout java_progress ──────────────────────────
      - name: Checkout java_progress
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      # ── 2. Set up Python ───────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # ── 3. Run the update script ───────────────────────────
      - name: Update java_progress README
        run: python .github/update_readme.py

      # ── 4. Commit + push java_progress README ──────────────
      - name: Commit java_progress README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "✅ No changes to commit, skipping."
            exit 0
          fi
          git commit -m "📊 Auto-update DSA progress table"
          git pull --rebase origin main
          git push

      # ── 5. Checkout profile repo (rajit2004/rajit2004) ─────
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          repository: rajit2004/rajit2004
          token: ${{ secrets.PAT_TOKEN }}
          path: profile-repo

      # ── 6. Update profile README ───────────────────────────
      - name: Update profile README
        run: |
          python - << 'EOF'
          import re

          with open(".github/dsa_section.md", "r", encoding="utf-8") as f:
              new_section = f.read()

          profile_readme = "profile-repo/README.md"
          with open(profile_readme, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r"(## 📈 DSA Progress.*?---\s*)"
          updated, n = re.subn(pattern, new_section + "\n", content, flags=re.DOTALL)

          if n == 0:
              print("[!] Pattern not found in profile README")
          else:
              with open(profile_readme, "w", encoding="utf-8") as f:
                  f.write(updated)
              print("[+] Profile README updated.")
          EOF

      # ── 7. Commit + push profile README ───────────────────
      - name: Commit profile README
        working-directory: profile-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "✅ No changes to commit, skipping."
            exit 0
          fi
          git commit -m "📊 Auto-update DSA progress table from java_progress"
          git pull --rebase origin main
          git push
